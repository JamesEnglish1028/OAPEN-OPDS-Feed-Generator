databases:
  - name: oapen-opds-db
    databaseName: oapen_opds
    user: oapen_opds_user
    plan: free

services:
  - type: keyvalue
    name: oapen-opds-cache
    plan: free
    ipAllowList: []

  - type: web
    name: oapen-opds-feed-generator
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: oapen-opds-db
          property: connectionString
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_DAILY_UTC_HOUR
        value: "2"
      - key: SCHEDULER_DAILY_UTC_MINUTE
        value: "0"
      - key: OPDS_CACHE_TTL_SECONDS
        value: "900"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: oapen-opds-cache
          property: connectionString
