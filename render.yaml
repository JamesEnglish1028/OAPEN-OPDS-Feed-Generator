services:
  - type: web
    name: oapen-opds-feed-generator
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./oapen_opds.db
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_DAILY_UTC_HOUR
        value: "2"
      - key: SCHEDULER_DAILY_UTC_MINUTE
        value: "0"
